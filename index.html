<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Drift Racer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 50%, #8B8B8B 50%, #555 100%);
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8),
                         0 0 10px rgba(0, 0, 0, 0.5);
            z-index: 10;
            pointer-events: none;
            font-family: 'Impact', sans-serif;
        }

        #speedometer {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.95) 100%);
            border-radius: 50%;
            border: 5px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.1);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #speedValue {
            color: #00ff00;
            font-size: 48px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 10px #00ff00;
        }

        #speedLabel {
            color: #fff;
            font-size: 14px;
            margin-top: -5px;
        }

        #driftIndicator {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: #ff1493;
            font-size: 36px;
            font-weight: bold;
            text-shadow: 0 0 20px #ff1493, 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
            display: none;
            animation: driftPulse 0.5s ease-in-out infinite;
        }

        @keyframes driftPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.8; }
        }

        #startScreen, #gameOver {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            backdrop-filter: blur(10px);
        }

        #gameOver {
            display: none;
        }

        h1 {
            color: #fff;
            font-size: 72px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            font-family: 'Impact', sans-serif;
            letter-spacing: 4px;
        }

        .gradient-text {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            color: #ccc;
            font-size: 18px;
            margin-bottom: 40px;
            text-align: center;
            line-height: 1.8;
            max-width: 600px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            padding: 20px 60px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        #instructions {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            text-align: right;
            z-index: 10;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stat {
            margin: 5px 0;
        }

        .stat-label {
            color: #888;
            font-size: 12px;
        }

        .stat-value {
            color: #fff;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div class="stat">
                <div class="stat-label">SCORE</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat" style="margin-top: 10px;">
                <div class="stat-label">COMBO</div>
                <div class="stat-value" id="combo" style="color: #ff6b6b;">×1</div>
            </div>
        </div>

        <div id="speedometer">
            <div id="speedValue">0</div>
            <div id="speedLabel">KM/H</div>
        </div>

        <div id="driftIndicator">
            🔥 DRIFTING! 🔥
        </div>

        <div id="instructions">
            <div style="margin-bottom: 10px; font-weight: bold; color: #4ecdc4;">CONTROLS</div>
            ← → Steer<br>
            ↑ Accelerate<br>
            ↓ Brake<br>
            SPACE Handbrake Drift
        </div>

        <div id="startScreen">
            <h1><span class="gradient-text">DRIFT RACER 3D</span></h1>
            <p>
                Experience realistic drifting physics!<br>
                Master the handbrake, control your slides, and chain combos.<br>
                The asphalt is yours - show us what you've got!
            </p>
            <button id="startBtn">START ENGINE</button>
        </div>

        <div id="gameOver">
            <h1>RACE COMPLETE</h1>
            <p id="finalScore" style="font-size: 32px; color: #4ecdc4;">Final Score: 0</p>
            <p id="finalStats" style="font-size: 16px; margin-top: -20px;"></p>
            <button id="restartBtn">RACE AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Game state
        let gameRunning = false;
        let score = 0;
        let combo = 1;
        let maxCombo = 1;
        let driftTime = 0;
        let totalDriftTime = 0;

        // Camera/perspective
        const camera = {
            x: 0,
            y: 0,
            z: 0,
            pitch: 0.15 // Looking slightly down
        };

        // Car physics
        const car = {
            x: 0,
            y: 0,
            z: -5,
            angle: 0,
            speed: 0,
            maxSpeed: 15,
            acceleration: 0.5,
            brake: 0.7,
            friction: 0.97,
            driftFriction: 0.95,
            turnSpeed: 0.04,
            drifting: false,
            driftAngle: 0,
            velocityX: 0,
            velocityZ: 0,
            wheelAngle: 0
        };

        // Road properties
        const road = {
            width: 800,
            segments: [],
            segmentLength: 100,
            curves: []
        };

        // Generate road segments
        function generateRoad() {
            road.segments = [];
            for (let i = 0; i < 100; i++) {
                const curve = Math.sin(i * 0.3) * 200 + (Math.random() - 0.5) * 100;
                road.segments.push({
                    z: i * road.segmentLength,
                    curve: curve,
                    x: 0
                });
            }
        }

        // Obstacles
        let obstacles = [];
        let lastObstacleZ = 0;

        function spawnObstacle() {
            if (car.z - lastObstacleZ > 300) {
                const side = Math.random() > 0.5 ? 1 : -1;
                obstacles.push({
                    x: side * (road.width / 2 - 100),
                    z: car.z + 2000,
                    size: 40,
                    type: 'cone'
                });
                lastObstacleZ = car.z;
            }
        }

        // Drift particles
        let particles = [];

        function createDriftParticle() {
            const angle = car.angle + (Math.random() - 0.5) * Math.PI;
            particles.push({
                x: car.x + Math.sin(angle) * 30,
                y: 0,
                z: car.z + Math.cos(angle) * 30,
                life: 30 + Math.random() * 20,
                size: 10 + Math.random() * 20,
                vx: (Math.random() - 0.5) * 2,
                vz: (Math.random() - 0.5) * 2
            });
        }

        // Input
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ') e.preventDefault();
        });
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Start game
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', restartGame);

        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            gameRunning = true;
            score = 0;
            combo = 1;
            maxCombo = 1;
            driftTime = 0;
            totalDriftTime = 0;
            car.x = 0;
            car.z = 0;
            car.angle = 0;
            car.speed = 0;
            car.drifting = false;
            obstacles = [];
            particles = [];
            lastObstacleZ = 0;
            generateRoad();
            gameLoop();
        }

        function restartGame() {
            document.getElementById('gameOver').style.display = 'none';
            startGame();
        }

        function gameLoop() {
            if (!gameRunning) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            // Acceleration
            if (keys['ArrowUp']) {
                car.speed = Math.min(car.speed + car.acceleration, car.maxSpeed);
            } else if (keys['ArrowDown']) {
                car.speed = Math.max(car.speed - car.brake, 0);
            }

            // Apply friction
            const currentFriction = car.drifting ? car.driftFriction : car.friction;
            car.speed *= currentFriction;

            // Steering
            const steerAmount = car.speed / car.maxSpeed;
            if (keys['ArrowLeft']) {
                car.wheelAngle = Math.max(car.wheelAngle - 0.1, -1);
            } else if (keys['ArrowRight']) {
                car.wheelAngle = Math.min(car.wheelAngle + 0.1, 1);
            } else {
                car.wheelAngle *= 0.8;
            }

            // Handbrake drift
            if (keys[' '] && car.speed > 5) {
                car.drifting = true;
                car.driftAngle += car.wheelAngle * 0.15;
                car.driftAngle = Math.max(-1.2, Math.min(1.2, car.driftAngle));
                
                driftTime++;
                totalDriftTime++;
                
                if (driftTime % 3 === 0) {
                    combo = Math.min(combo + 0.1, 10);
                    score += Math.floor(10 * combo);
                    maxCombo = Math.max(maxCombo, combo);
                }

                // Create drift particles
                if (Math.random() > 0.6) {
                    createDriftParticle();
                }

                document.getElementById('driftIndicator').style.display = 'block';
            } else {
                if (car.drifting) {
                    combo = 1;
                    driftTime = 0;
                }
                car.drifting = false;
                car.driftAngle *= 0.85;
                document.getElementById('driftIndicator').style.display = 'none';
            }

            // Update angle based on steering
            if (!car.drifting) {
                car.angle += car.wheelAngle * car.turnSpeed * steerAmount;
            } else {
                car.angle += car.wheelAngle * car.turnSpeed * steerAmount * 0.5;
            }

            // Calculate velocity
            const totalAngle = car.angle + car.driftAngle;
            car.velocityX = Math.sin(totalAngle) * car.speed;
            car.velocityZ = Math.cos(totalAngle) * car.speed;

            // Move car
            car.x += car.velocityX;
            car.z += car.velocityZ;

            // Keep car on road
            const currentSegment = Math.floor(car.z / road.segmentLength) % road.segments.length;
            const roadCenter = road.segments[currentSegment].curve;
            
            if (Math.abs(car.x - roadCenter) > road.width / 2 - 50) {
                gameOver();
            }

            // Update camera
            camera.x = car.x;
            camera.z = car.z - 150;

            // Spawn obstacles
            spawnObstacle();

            // Update obstacles
            obstacles.forEach((obs, i) => {
                const dx = car.x - obs.x;
                const dz = car.z - obs.z;
                const dist = Math.sqrt(dx * dx + dz * dz);
                
                if (dist < 60) {
                    gameOver();
                }

                if (car.z - obs.z > 500) {
                    obstacles.splice(i, 1);
                    score += 50;
                }
            });

            // Update particles
            particles.forEach((p, i) => {
                p.life--;
                p.x += p.vx;
                p.z += p.vz;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            });

            // Update UI
            document.getElementById('score').textContent = Math.floor(score);
            document.getElementById('combo').textContent = '×' + combo.toFixed(1);
            document.getElementById('speedValue').textContent = Math.floor(car.speed * 20);
        }

        function project3D(x, y, z) {
            const dx = x - camera.x;
            const dy = y;
            const dz = z - camera.z;

            if (dz <= 0) return null;

            const scale = 400 / dz;
            const screenX = canvas.width / 2 + dx * scale;
            const screenY = canvas.height / 2 + (dy - camera.pitch * dz) * scale;

            return { x: screenX, y: screenY, scale: scale };
        }

        function draw() {
            // Sky gradient
            const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height / 2);
            skyGradient.addColorStop(0, '#4A90E2');
            skyGradient.addColorStop(1, '#87CEEB');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height / 2);

            // Ground
            const groundGradient = ctx.createLinearGradient(0, canvas.height / 2, 0, canvas.height);
            groundGradient.addColorStop(0, '#4a7c59');
            groundGradient.addColorStop(1, '#2d5016');
            ctx.fillStyle = groundGradient;
            ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);

            // Draw road segments
            for (let i = 0; i < 50; i++) {
                const segmentIndex = (Math.floor(car.z / road.segmentLength) + i) % road.segments.length;
                const segment = road.segments[segmentIndex];
                const nextSegment = road.segments[(segmentIndex + 1) % road.segments.length];

                const z1 = segment.z;
                const z2 = nextSegment.z;

                const roadColor = i % 2 === 0 ? '#3a3a3a' : '#454545';
                
                // Project road corners
                const p1Left = project3D(segment.curve - road.width / 2, 0, z1);
                const p1Right = project3D(segment.curve + road.width / 2, 0, z1);
                const p2Left = project3D(nextSegment.curve - road.width / 2, 0, z2);
                const p2Right = project3D(nextSegment.curve + road.width / 2, 0, z2);

                if (p1Left && p1Right && p2Left && p2Right) {
                    // Draw road segment
                    ctx.fillStyle = roadColor;
                    ctx.beginPath();
                    ctx.moveTo(p1Left.x, p1Left.y);
                    ctx.lineTo(p1Right.x, p1Right.y);
                    ctx.lineTo(p2Right.x, p2Right.y);
                    ctx.lineTo(p2Left.x, p2Left.y);
                    ctx.closePath();
                    ctx.fill();

                    // Road markings
                    if (i % 4 === 0) {
                        const pCenter = project3D(segment.curve, 0, z1);
                        const pCenterNext = project3D(nextSegment.curve, 0, z2);
                        
                        if (pCenter && pCenterNext) {
                            ctx.strokeStyle = '#ffff00';
                            ctx.lineWidth = 3 * pCenter.scale;
                            ctx.beginPath();
                            ctx.moveTo(pCenter.x, pCenter.y);
                            ctx.lineTo(pCenterNext.x, pCenterNext.y);
                            ctx.stroke();
                        }
                    }

                    // Road edges
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(p1Left.x, p1Left.y);
                    ctx.lineTo(p2Left.x, p2Left.y);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(p1Right.x, p1Right.y);
                    ctx.lineTo(p2Right.x, p2Right.y);
                    ctx.stroke();
                }
            }

            // Draw particles
            particles.forEach(p => {
                const proj = project3D(p.x, p.y, p.z);
                if (proj) {
                    const alpha = p.life / 50;
                    ctx.fillStyle = `rgba(100, 100, 100, ${alpha * 0.6})`;
                    ctx.beginPath();
                    ctx.arc(proj.x, proj.y, p.size * proj.scale, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Draw obstacles (cones)
            obstacles.forEach(obs => {
                const proj = project3D(obs.x, 0, obs.z);
                const projTop = project3D(obs.x, -60, obs.z);
                
                if (proj && projTop) {
                    const size = obs.size * proj.scale;
                    
                    // Cone shadow
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                    ctx.beginPath();
                    ctx.ellipse(proj.x, proj.y + 2, size * 0.6, size * 0.3, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Cone body
                    const gradient = ctx.createLinearGradient(proj.x - size, projTop.y, proj.x + size, proj.y);
                    gradient.addColorStop(0, '#ff6600');
                    gradient.addColorStop(0.5, '#ff8800');
                    gradient.addColorStop(1, '#cc5500');
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.moveTo(projTop.x, projTop.y);
                    ctx.lineTo(proj.x - size, proj.y);
                    ctx.lineTo(proj.x + size, proj.y);
                    ctx.closePath();
                    ctx.fill();
                    
                    // White stripe
                    ctx.fillStyle = '#fff';
                    const stripeY = projTop.y + (proj.y - projTop.y) * 0.4;
                    ctx.beginPath();
                    ctx.moveTo(projTop.x + (proj.x - size - projTop.x) * 0.4, stripeY);
                    ctx.lineTo(projTop.x + (proj.x + size - projTop.x) * 0.4, stripeY);
                    ctx.lineTo(proj.x + size * 0.8, proj.y);
                    ctx.lineTo(proj.x - size * 0.8, proj.y);
                    ctx.closePath();
                    ctx.fill();
                }
            });

            // Draw car (centered)
            const carProj = { x: canvas.width / 2, y: canvas.height * 0.75, scale: 1 };
            
            ctx.save();
            ctx.translate(carProj.x, carProj.y);
            ctx.rotate(car.driftAngle * 0.5);

            // Car shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(-40, 50, 80, 120);

            // Car body with gradient for 3D effect
            const carGradient = ctx.createLinearGradient(-40, -60, 40, 60);
            if (car.drifting) {
                carGradient.addColorStop(0, '#ff1493');
                carGradient.addColorStop(0.5, '#ff69b4');
                carGradient.addColorStop(1, '#ff1493');
            } else {
                carGradient.addColorStop(0, '#e74c3c');
                carGradient.addColorStop(0.5, '#c0392b');
                carGradient.addColorStop(1, '#e74c3c');
            }
            
            ctx.fillStyle = carGradient;
            ctx.fillRect(-40, -60, 80, 120);

            // Car details
            // Windshield
            ctx.fillStyle = 'rgba(100, 150, 200, 0.6)';
            ctx.fillRect(-30, -50, 60, 40);

            // Roof
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(-35, -55, 70, 35);

            // Hood lines
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-20, 20);
            ctx.lineTo(-20, 60);
            ctx.moveTo(20, 20);
            ctx.lineTo(20, 60);
            ctx.stroke();

            // Headlights
            ctx.fillStyle = '#ffff99';
            ctx.fillRect(-35, 50, 15, 8);
            ctx.fillRect(20, 50, 15, 8);

            // Wheels
            ctx.fillStyle = '#000';
            ctx.save();
            ctx.translate(-30, -30);
            ctx.rotate(car.wheelAngle * 0.3);
            ctx.fillRect(-8, -12, 16, 24);
            ctx.restore();

            ctx.save();
            ctx.translate(30, -30);
            ctx.rotate(car.wheelAngle * 0.3);
            ctx.fillRect(-8, -12, 16, 24);
            ctx.restore();

            ctx.fillRect(-38, 30, 16, 24);
            ctx.fillRect(22, 30, 16, 24);

            // Drift glow
            if (car.drifting) {
                ctx.strokeStyle = 'rgba(255, 20, 147, 0.6)';
                ctx.lineWidth = 6;
                ctx.strokeRect(-45, -65, 90, 130);
                
                ctx.strokeStyle = 'rgba(255, 105, 180, 0.3)';
                ctx.lineWidth = 12;
                ctx.strokeRect(-50, -70, 100, 140);
            }

            ctx.restore();
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = `Final Score: ${Math.floor(score)}`;
            document.getElementById('finalStats').textContent = 
                `Max Combo: ×${maxCombo.toFixed(1)} | Total Drift Time: ${(totalDriftTime / 60).toFixed(1)}s`;
            document.getElementById('gameOver').style.display = 'flex';
        }
    </script>
</body>
</html>
